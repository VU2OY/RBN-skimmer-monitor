[telegram]
# From @BotFather (create a bot with /newbot)
bot_token =
# Your chat id: message your bot, then open
# https://api.telegram.org/bot<TOKEN>/getUpdates and copy "chat":{"id": ...}
chat_id =

[skimmer]
# Matches spotter calls like YOURCALL-#, YOURCALL-9-# (and YOURCALL for WSPR)
callsign_pattern = YOURCALL*
# Call used to log in to the RBN telnet feed
login_call = YOURCALL

[rbn]
host = telnet.reversebeacon.net

[thresholds]
# Minutes without a spot before alerting. Remove a line to stop watching that mode.
CW = 60
RTTY = 1440
FT8 = 60
WSPR = 1440
